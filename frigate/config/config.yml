# Frigate configuration for a Reolink RLC-823S2.
# {FRIGATE_*} variables are supplied from .env by docker-compose.

mqtt:
  enabled: true
  host: mqtt

go2rtc:
  streams:
    # main stream (4K H.265): recording and vision service
    yard_ptz:
      - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@{FRIGATE_CAM_IP}:554/Preview_01_main
    # sub stream: Frigate detection
    yard_ptz_sub:
      - rtsp://{FRIGATE_CAM_USER}:{FRIGATE_CAM_PASS}@{FRIGATE_CAM_IP}:554/Preview_01_sub

# CPU detector; use OpenVINO on Intel hardware.
detectors:
  cpu1:
    type: cpu

# Plate recognition is handled by the vision service.
lpr:
  enabled: false

objects:
  track: [person, car, truck, motorcycle]

record:
  enabled: true
  retain:
    days: 3
    mode: motion
  alerts:
    retain:
      days: 30
  detections:
    retain:
      days: 30

snapshots:
  enabled: true
  bounding_box: true
  timestamp: true
  retain:
    default: 30

cameras:
  yard_ptz:
    ffmpeg:
      # hwaccel_args: preset-vaapi  # Intel iGPU
      inputs:
        - path: rtsp://127.0.0.1:8554/yard_ptz
          input_args: preset-rtsp-restream
          roles: [record]
        - path: rtsp://127.0.0.1:8554/yard_ptz_sub
          input_args: preset-rtsp-restream
          roles: [detect]
    # streams selectable in the Frigate live view
    live:
      streams:
        Main (4K): yard_ptz
        Sub (fast): yard_ptz_sub
    detect:
      enabled: true
      width: 640      # sub stream resolution
      height: 360
      fps: 5
    # PTZ control from the Frigate UI (use the camera's built-in auto-tracking).
    onvif:
      host: "{FRIGATE_CAM_IP}"
      port: 8000
      user: "{FRIGATE_CAM_USER}"
      password: "{FRIGATE_CAM_PASS}"
