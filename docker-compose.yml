services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.16.1
    container_name: frigate
    restart: unless-stopped
    shm_size: "512mb"
    # Intel iGPU: enable for hardware decoding and OpenVINO detection
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ./frigate/config:/config
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"   # Frigate UI (HTTPS)
      - "8554:8554"   # RTSP restream
    environment:
      TZ: ${TZ:-Europe/London}
      FRIGATE_CAM_IP: ${CAM_IP}
      FRIGATE_CAM_USER: ${CAM_USER}
      FRIGATE_CAM_PASS: ${CAM_PASS}
    depends_on: [mqtt]

  mqtt:
    image: eclipse-mosquitto:2.0.20
    container_name: mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # internal only; not published to the host

  # Self-hosted notification server (optional; used when NTFY_SERVER=http://ntfy)
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      NTFY_BASE_URL: http://${HOST_IP:-localhost}:8080
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      NTFY_ATTACHMENT_FILE_SIZE_LIMIT: 50M
      NTFY_ATTACHMENT_EXPIRY_DURATION: 24h
    volumes:
      - ./data/ntfy:/var/cache/ntfy
    ports:
      - "8080:80"

  # Detection, tracking, plate recognition, recording, notifications and dashboard (port 8090)
  vision:
    build: ./vision
    container_name: vision
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      CAMERA: yard_ptz
      STREAM_URL: rtsp://frigate:8554/yard_ptz   # main stream via Frigate restream
      DISPLAY_WIDTH: "1920"            # live view width in pixels
      DISPLAY_FPS: "12"                # live view frame rate
      NTFY_SERVER: ${NTFY_SERVER:-https://ntfy.sh}   # https://ntfy.sh or http://ntfy (self-hosted)
      NTFY_TOPIC: ${NTFY_TOPIC:-}                     # empty: generate a random private topic
      NTFY_PUBLIC_URL: ${NTFY_PUBLIC_URL:-}           # self-hosted only: URL reachable by client devices
      PERSON_ALERTS: "1"               # initial state of the dashboard person-alert switch
      PERSON_ALERT_HOURS: ${PERSON_ALERT_HOURS:-always}   # active hours, e.g. 18:00-07:00
      PERSON_ALERT_GAP: "20"           # minimum seconds between arrival notifications
      SEND_CLIPS: "1"                  # attach the annotated clip after an alert
      PLATE_ALERT_COOLDOWN: "3600"     # seconds before re-notifying the same unknown plate
      PLATE_MIN_SCORE: "0.7"           # minimum plate read confidence
      FPS: "5"                         # detection rate
      POSE: "1"                        # pose-based behaviour classification
      LOITER_SECONDS: "120"            # loitering threshold (s)
      BEHAVIOUR_ALERTS: "lying down,climbing,restricted zone,loitering"   # sent with urgent priority
      WHITELIST_PATH: /settings/whitelist.yaml
      DB_PATH: /data/vision.db
      RECORD: "1"                      # record while people or vehicles are in view
      RECORD_POST_ROLL: "10"           # seconds recorded after the scene clears
      RECORD_KEEP_RAW: "1"             # also keep the original stream (stream copy)
      RECORD_KEEP_DAYS: "30"           # retention (days)
    volumes:
      - ./settings:/settings          # whitelist.yaml, zones.yaml
      - ./data:/data
      - ./recordings:/recordings
    ports:
      - "8090:8090"
    depends_on: [frigate, ntfy]
