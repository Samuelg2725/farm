services:
  frigate:
    image: ghcr.io/blakeblackshear/frigate:0.16.1   # check for newer stable release
    container_name: frigate
    restart: unless-stopped
    shm_size: "512mb"
    # Uncomment on an Intel mini PC for hardware video decode + OpenVINO detection:
    # devices:
    #   - /dev/dri/renderD128:/dev/dri/renderD128
    volumes:
      - ./frigate/config:/config
      - ./storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"   # Frigate web UI (HTTPS, login required)
      - "8554:8554"   # RTSP restream (optional)
    environment:
      TZ: ${TZ:-Europe/London}
      FRIGATE_CAM_IP: ${CAM_IP}
      FRIGATE_CAM_USER: ${CAM_USER}
      FRIGATE_CAM_PASS: ${CAM_PASS}
    depends_on: [mqtt]

  mqtt:
    image: eclipse-mosquitto:2.0.20
    container_name: mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    # Not exposed outside the Docker network on purpose.


  # Open-source push notifications (phone app: "ntfy" on Android / iOS / F-Droid)
  ntfy:
    image: binwiederhier/ntfy:v2.11.0
    container_name: ntfy
    command: serve
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      NTFY_BASE_URL: http://${HOST_IP:-localhost}:8080
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
    volumes:
      - ./data/ntfy:/var/cache/ntfy
    ports:
      - "8080:80"

  # People tracking + number plate checks together, one live view: http://localhost:8090
  vision:
    build: ./vision
    container_name: vision
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/London}
      CAMERA: yard_ptz
      STREAM_URL: rtsp://frigate:8554/yard_ptz   # 4K main stream: live view, detection and plates
      DISPLAY_WIDTH: "1920"            # live view size: 1920 = 1080p, 2560 = 1440p, 3840 = full 4K
      DISPLAY_FPS: "12"                # live view refresh rate
      NTFY_URL: ${NTFY_SERVER:-http://ntfy}/${NTFY_TOPIC:-farm-alerts}
      PERSON_ALERT_HOURS: ${PERSON_ALERT_HOURS:-always}   # always | never | 18:00-07:00
      PERSON_ALERT_COOLDOWN: "300"     # seconds between person alerts
      PLATE_ALERT_COOLDOWN: "3600"     # don't re-alert the same unknown plate within an hour
      PLATE_MIN_SCORE: "0.7"           # how sure a plate read must be before deciding
      FPS: "5"                         # detections per second
      WHITELIST_PATH: /settings/whitelist.yaml
      DB_PATH: /data/vision.db
    volumes:
      - ./settings:/settings:ro
      - ./data:/data
    ports:
      - "8090:8090"
    depends_on: [frigate, ntfy]
